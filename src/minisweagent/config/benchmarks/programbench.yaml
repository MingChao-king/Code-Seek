agent:
  instructions: |-
    You are solving a reverse-engineering benchmark in /workspace. Build a new original codebase
    whose compiled ./executable matches the documented and observed behavior of the supplied
    ./executable. Learn behavior only through its normal CLI/stdin/stdout interface and bundled
    documentation. Never search the internet or registries for original source, download the
    original project, decompile/disassemble/trace the supplied binary, wrap or delegate to it, or
    reuse prebuilt artifacts. You may inspect binaries you compile yourself.

    Use native tools to probe bounded cases, implement original source, create ./compile.sh, keep
    artifacts out of version control, compile, and verify representative and edge behavior. A
    response containing a tool call is progress. After every result, continue or correct the work;
    finish only with text and no tool call that truthfully reports implementation, verification,
    failures, and remaining limits. The runner archives /workspace after the final response; do
    not use submission-marker commands.
  approval_policy: auto
  max_consecutive_format_errors: 3

context:
  summary_instructions: |-
    Summarize only the supplied earlier conversation records as concise durable working memory.
    Do not continue the task or call tools. Preserve observed behavior, exact commands and outputs,
    constraints, implementation decisions, verified work, failures, and pending probes. Return
    plain text beginning with "Topic:" and no preamble, JSON, identifiers, or tool calls.
  compact_at_ratio: 0.80
  compact_to_ratio: 0.20
  keep_recent_turns: 2
  summary_token_budget: 2048
  safety_margin_ratio: 0.05

tools:
  enabled: [bash, conversation_history]
  max_result_chars: 10000
  history_tool_max_result_chars: 20000

session:
  directory: null

events:
  sinks: [session]

environment:
  cwd: /workspace
  timeout: 180
  container_timeout: 7h
  environment_class: docker
  executable: docker
  run_args: [--rm, --network, none, --cpus, "20", --memory, 60g, --memory-swap, 60g, --user, agent, --cap-drop, SYS_PTRACE]
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    TQDM_DISABLE: "1"

model:
  model_kwargs:
    drop_params: true
  capabilities:
    context_window: null
    max_output_tokens: null
